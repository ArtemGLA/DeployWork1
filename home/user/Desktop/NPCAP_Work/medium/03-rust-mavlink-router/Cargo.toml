[package]
name = "mavlink-router"
version = "0.1.0"
edition = "2021"
description = "MAVLink message router"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"
